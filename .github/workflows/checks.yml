name: Public release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Privacy and scanner tests
        run: |
          python tools/privacy-check.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: PHP syntax
        run: find theme plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find theme plugin -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build and inspect installable packages
        run: python tools/build-release.py

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.5'
            php: '8.1'
          - wp: latest
            php: '8.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installation ZIPs
        run: python tools/build-release.py
      - name: Isolated real WordPress integration
        run: >-
          npx --yes @wp-playground/cli@3.1.56 run-blueprint
          --wp=${{ matrix.wp }} --php=${{ matrix.php }}
          --mount=./dist:/packages
          --mount=./tests:/tests --blueprint=./tests/blueprint.json
